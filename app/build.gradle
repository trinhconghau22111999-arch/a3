plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.screencast.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.screencast.app"
        minSdk 24
        targetSdk 34
        // versionCode tự tăng theo thời điểm build để cài đè được lên bản cũ
        versionCode (System.currentTimeMillis() / 1000L).toInteger()
        versionName "1.1"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // Keystore cố định (dùng chung mọi lần build) để cài đè không cần gỡ app
    signingConfigs {
        fixed {
            storeFile file("../keystore/ytbrowser-debug.keystore")
            storePassword "ytbrowser123"
            keyAlias "ytbrowser"
            keyPassword "ytbrowser123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:125.6422.06'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
}
